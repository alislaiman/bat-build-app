name: Build Android test app
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install
        run: npm ci
      - name: App icon
        run: npx capacitor-assets generate --android --iconBackgroundColor '#0a0a0a' --iconBackgroundColorDark '#0a0a0a' --splashBackgroundColor '#0a0a0a' --splashBackgroundColorDark '#0a0a0a'
        continue-on-error: true
      - name: Prepare Android project
        run: npx cap sync android
      - name: Build the app file (APK)
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug --no-daemon
      - name: Save the app file
        uses: actions/upload-artifact@v4
        with:
          name: BAT-Build-android-test
          path: android/app/build/outputs/apk/debug/app-debug.apk
