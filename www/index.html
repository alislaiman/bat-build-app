}
async function cloudFail(msg){alert('Could not save: '+msg);try{await cloudLoad()}catch(e){}render()}

 if(viewAs){alert(RO_MSG);return false}
 if(!CLOUD){if(coll==='procurement'&&typeof stockLocalDelivery==='function')stockLocalDelivery(rec);save();markDirty(coll,rec);return true}
 const t=sb.from(TABLE[coll]),row=toRow(coll,rec);
 const back=isNew&&['docs','procurement','projects','logs','issues','forms','boq','design','quotes'].includes(coll);
 const{data,error}=isNew?(back?await t.insert(row).select():await t.insert(row)):await t.update(row).eq('id',rec.id).select('id');
 if(!error&&back&&data&&data[0])Object.assign(rec,fromRow(data[0]));
 if(error){cloudFail(error.message);return false}

 markDirty(coll,rec);return true;
}

}

function editRule(coll,rec){
 if(!rec.id)return canCreate(coll)?'all':null;
 if(coll==='users')return canManageUser(rec)?'all':null;
 if(coll==='requests')return me().role==='director'?'all':(isOwn(rec)&&rec.status==='New'?'all':null);
 const e=R().edit;if(e==='all')return coll==='projects'&&!R().all?['status','end',...PDETAILS]:'all';
 const r=e[coll];if(!r)return null;
 if(r==='all'||Array.isArray(r))return r;
 if(r==='own')return isOwn(rec)?'all':null;
 if(r==='ownRequested')return isOwn(rec)&&rec.status==='Requested'?'all':null;
 if(r==='ownProgress')return rec.assignee===me().team?['progress','status']:null;
 return null;
}

 if(u.id===session)return false;

 else{Object.assign(o,f);const nm=me().name;
  if(f.status==='Approved')o.approvedBy=nm;

 if(o.status==='Sent'&&prev.status!=='Sent')I.filter(x=>x.status==='Approved').forEach(x=>{x.status='Ordered';x.orderedBy=o.sentBy;x.supplier=o.supplier});

let prmPriceMode=false,prmPE={},prmOpen=new Set(),prmTab='',prmF='',prmCart={},prmRecv=[{product:'',qty:'',cost:''}],prmRecvSup='',prmRecvNote='';
const PRM_LOGO='assets/promat.jpg';
const PRM_ORDER_ROLES=['director','pm','site','procurement','architect','mep','sub'];
const PRM_PAY=['Cash','Transfer','Mobile money'];

const PRM_ST_FR={Ordered:'Commandé',Prepared:'Prêt',Issued:'Remis',Cancelled:'Annulé'};
const prmStaff=()=>['store','director'].includes(me().role);

const prmItemsOf=o=>db.prmItems.filter(i=>i.orderId===o.id);

const prmVisibleOrders=()=>{const r=me().role;
 if(['store','director','procurement','accountant'].includes(r))return db.prmOrders;
 if(r==='sub')return db.prmOrders.filter(o=>o.by===session||(o.company===me().team&&inScope(o.project)));

function prmTabs(){const r=me().role,t=[];

function prmNotifyLocal(users,title,body){const now=new Date().toISOString();
 users.filter(u=>u&&u.id!==session).forEach(u=>db.notifs.push({id:uid(),user:u.id,project:'',kind:'promat',title,body,link:'promat',readAt:'',by:session,created_at:now}))}
function prmMoveLocal(pid,kind,qty,extra){const p=prmProd(pid);if(!p)throw new Error('Unknown product');
 const before=+p.stock||0;if(before+qty<0)throw new Error(`Not enough ${p.name} in stock (${fmtQ(before)} ${p.unit} left)`);
 p.stock=before+qty;
 db.prmMoves.push({id:uid(),product:pid,kind,qty,ref:'',supplier:'',unitCost:0,note:'',...extra,stockAfter:p.stock,byName:me().name,by:session,created_at:new Date().toISOString()});
 if(p.stock<(+p.minStock||0)&&before>=(+p.minStock||0))prmNotifyLocal(db.users.filter(u=>['store','director'].includes(u.role)),`PROMAT: ${p.name} is running low`,`Only ${fmtQ(p.stock)} ${p.unit} left (alert level ${fmtQ(p.minStock)}). ${p.code}`)}
async function prmSavePrices(){
 const ch=Object.entries(prmPE).map(([id,v])=>({id,price:String(v).trim()===''?0:+v})).filter(x=>{const p=prmProd(x.id);return p&&isFinite(x.price)&&x.price!==(+p.price||0)});
 if(ch.some(x=>x.price<0)){alert('A price cannot be negative.');return}
 const b=$('#prmPriceSave');if(b){b.disabled=true;b.textContent='Saving…'}
 if(ch.length){if(CLOUD){const{error}=await sb.rpc('promat_set_prices',{p_prices:ch});if(error){alert(error.message);if(b){b.disabled=false;b.textContent='Save prices'}return}}
  else ch.forEach(x=>prmProd(x.id).price=x.price)}
 prmPriceMode=false;prmPE={};prmDone()}
async function prmDone(){if(CLOUD){try{await cloudLoad()}catch(e){}}else save();render()}

function prmCatalogue(){

 const top=`<div class="toolbar"><input id="q" placeholder="Search products…" value="${esc(q)}">${staff?(prmPriceMode?'<button class="btn ghost" id="prmPriceCancel">Cancel</button><button class="btn" id="prmPriceSave">Save prices</button>':'<button class="btn ghost" id="prmPrices">Set prices</button><button class="btn" id="prmNewProd">+ Product</button>'):''}</div>`

 const row=p=>{const st=+p.stock||0;
  const stock=seeStock?`<b>${fmtQ(st)}</b> ${esc(p.unit)} in stock${prmLow(p)?' <span class="pill p-bad">Low</span>':''}`:st>0?`<span class="pill p-ok">In stock</span> ${fmtQ(st)} ${esc(p.unit)}`:'<span class="pill p-bad">Out of stock</span>';
  return `<div class="prow${p.active===false?' off':''}"><div class="main"><div class="t"><span class="ref">${esc(p.code||'…')}</span> ${esc(p.name)}${p.active===false?' <span class="pill">Hidden</span>':''}</div>
   <div class="s">${+p.price>0?money(p.price)+' / '+esc(p.unit||'unit'):'<span class="pill p-warn">No price yet</span>'} · ${stock}${staff&&+p.minStock?` · alert at ${fmtQ(p.minStock)}`:''}</div></div>
   <div class="pact">${staff&&prmPriceMode?`<input type="number" min="0" step="any" inputmode="decimal" class="ppin" placeholder="FCFA" aria-label="Price of ${esc(p.name)}" data-pp="${p.id}" value="${esc(prmPE[p.id]??(+p.price||''))}">`:order&&p.active!==false&&+p.price>0?`<input type="number" min="0" step="any" inputmode="decimal" placeholder="Qty" aria-label="Quantity of ${esc(p.name)}" data-cq="${p.id}" value="${prmCart[p.id]||''}">`:''}

let subSel=null;
const SUB_KIND={Fixed:'Fixed price',Measured:'By measurement'};
const SUB_KIND_FR={Fixed:'Forfait',Measured:'Au métré'};
const SUB_ST_FR={Draft:'Brouillon',Checked:'Vérifiée',Approved:'Approuvée',Paid:'Payée'};
const SUB_PAY=['Transfer','Cheque','Cash','Mobile money'];
const SUB_PAY_FR={Transfer:'Virement',Cheque:'Chèque',Cash:'Espèces','Mobile money':'Mobile money'};
const subMgr=c=>me().role==='director'||(me().role==='pm'&&inScope(c?.project??projF));
const subPayer=()=>['director','accountant'].includes(me().role);
const subVisible=()=>me().role==='sub'?db.subContracts.filter(c=>String(c.company).toLowerCase()===String(me().team||'').toLowerCase()&&inScope(c.project)):db.subContracts.filter(c=>R().all||inScope(c.project));
const subLinesOf=c=>db.subLines.filter(l=>l.contract===c.id).sort((a,b)=>(a.pos||0)-(b.pos||0));
const subLineAmt=l=>(+l.qty||0)*(+l.unitPrice||0);
const subCAmount=c=>subLinesOf(c).reduce((a,l)=>a+subLineAmt(l),0);
const subStOf=c=>db.subStatements.filter(s=>s.contract===c.id).sort((a,b)=>(a.seq||0)-(b.seq||0));
const subPrevSt=(c,seq)=>subStOf(c).filter(s=>s.kind==='Progress'&&s.seq<seq&&s.status!=='Draft').pop();
const subDone=(st,lid)=>st?db.subStLines.find(x=>x.statement===st.id&&x.line===lid)?.done:undefined;
const subLineVal=(c,l,done)=>c.kind==='Fixed'?subLineAmt(l)*Math.min(+done||0,100)/100:(+done||0)*(+l.unitPrice||0);
const subPaidOf=st=>db.subPayments.filter(p=>p.statement===st.id).reduce((a,p)=>a+(+p.amount||0),0);
const subOpen=c=>subStOf(c).some(s=>['Draft','Checked'].includes(s.status));
function subCalc(c,st,doneMap,deds){
 if(st.kind==='Retention release'){const held=subStOf(c).filter(s=>s.kind==='Progress'&&['Approved','Paid'].includes(s.status)).reduce((a,s)=>a+(+s.retentionAmount||0),0);return{gross:0,prev:0,period:0,ret:-held,pen:0,net:held}}
 const pv=subPrevSt(c,st.seq||1e9),gross=Math.round(subLinesOf(c).reduce((a,l)=>a+subLineVal(c,l,doneMap[l.id]??subDone(pv,l.id)??0),0));
 const prev=+pv?.grossToDate||0,period=gross-prev,ret=Math.round(period*(+c.retentionPct||0)/100),pen=deds.reduce((a,d)=>a+(+d.amount||0),0);
 return{gross,prev,period,ret,pen,net:period-ret-pen}}
function subAccount(c){const S=subStOf(c),appr=S.filter(s=>['Approved','Paid'].includes(s.status));
 const lastP=appr.filter(s=>s.kind==='Progress').pop(),amount=subCAmount(c),done=+lastP?.grossToDate||0;
 const retHeld=appr.reduce((a,s)=>a+(+s.retentionAmount||0),0),pen=appr.reduce((a,s)=>a+(+s.penaltiesAmount||0),0),net=appr.reduce((a,s)=>a+(+s.netAmount||0),0);
 const paid=db.subPayments.filter(p=>p.contract===c.id).reduce((a,p)=>a+(+p.amount||0),0);
 return{amount,done,pct:amount?Math.round(100*done/amount):0,retHeld,pen,net,paid,owed:net-paid}}
const subPromatOwed=comp=>db.prmOrders.filter(o=>o.buyer==='Subcontractor'&&!o.paid&&o.status!=='Cancelled'&&String(o.company).toLowerCase()===String(comp).toLowerCase()).reduce((a,o)=>a+prmTotal(o),0);

function subStatementForm(c,st,kind){

 st=st||{contract:c.id,kind:kind||'Progress',seq:(Math.max(0,...subStOf(c).map(s=>s.seq||0))+1),periodEnd:today(),notes:'',status:'Draft'};

 const done={};L.forEach(l=>{const d=subDone(isNew?null:st,l.id);done[l.id]=d!==undefined?d:(subDone(pv,l.id)||0)});
 let deds=isNew?[]:db.subDeductions.filter(d=>d.statement===st.id).map(d=>({reason:d.reason,amount:d.amount}));
 const sum=()=>{const a=st.status==='Draft'?subCalc(c,st,done,deds):{gross:+st.grossToDate,prev:+st.previousToDate,period:+st.periodAmount,ret:+st.retentionAmount,pen:+st.penaltiesAmount,net:+st.netAmount};

 const drawDed=()=>{$('#stDed').innerHTML=deds.map((d,i)=>`<div class="rline fx"><input data-dd="${i}" data-k="reason" placeholder="Reason (delay, damage, materials supplied…)" value="${esc(d.reason)}" maxlength="300" ${edit?'':'disabled'}><input data-dd="${i}" data-k="amount" type="number" min="0" step="any" placeholder="Amount" value="${esc(d.amount)}" ${edit?'':'disabled'}>${edit?`<button type="button" class="btn sm ghost" data-dddel="${i}" aria-label="Remove">×</button>`:'<span></span>'}</div>`).join('')+(edit?'<button type="button" class="btn sm ghost" id="ddAdd">+ Penalty</button>':deds.length?'':'<span class="s">None</span>');

 f.innerHTML=`<h3>${rel?'Retention release':'Progress statement '+st.seq} ${st.number?`<span class="ref">${esc(st.number)}</span>`:''}</h3><p class="s" style="margin-top:-6px">${esc(c.number)} · ${esc(c.company)} · ${SUB_KIND[c.kind]}</p>
 <div class="f"><label>Work up to (date)</label><input name="pe" type="date" value="${esc(st.periodEnd||'')}" ${edit?'':'disabled'}></div>
 ${rel?'<p class="s">Pays back the retention held on all approved statements. Do this at the end of the guarantee period.</p>':`<div style="overflow-x:auto"><table class="prmt"><tr><th>Line</th><th class="n">Before</th><th class="n">Done to date</th></tr>${rows}</table></div>
 <div class="f"><label>Penalties / back-charges</label><div id="stDed"></div></div>`}
 <table class="prmt" id="stSum"></table>
 <div class="f"><label>Notes</label><textarea name="notes" rows="2" maxlength="2000" ${edit?'':'disabled'}>${esc(st.notes||'')}</textarea></div>
 <div class="actions"><button type="button" class="btn ghost" id="cancel">${edit?'Cancel':'Close'}</button>${edit?`<button type="button" class="btn ghost" id="stSave">Save draft</button><button class="btn">${rel?'Confirm release':'Submit as checked'}</button>`:''}</div>`;
 if(!rel)drawDed();sum();

  if(!rel&&c.kind==='Fixed'&&L.some(l=>+done[l.id]>100)){alert('A fixed-price part cannot be more than 100%.');return}

    st={...st,id:uid(),project:c.project,number:localRef(c.project,'SIT'),checkedBy:'',approvedBy:'',by:session,created_at:new Date().toISOString()};db.subStatements.push(st)}
   st.periodEnd=pe||'';st.notes=notes;db.subStLines=db.subStLines.filter(x=>x.statement!==st.id);db.subDeductions=db.subDeductions.filter(x=>x.statement!==st.id);
   lines.forEach(x=>db.subStLines.push({id:uid(),statement:st.id,line:x.line,done:x.done}));D.forEach(x=>db.subDeductions.push({id:uid(),statement:st.id,...x}));
   subStoreAmounts(c,st);if(submit)subSetStatusLocal(c,st,'Checked')}
  $('#dlg').close();subDone_()};
 $('#stSave')&&($('#stSave').onclick=()=>doSave(false));
 f.onsubmit=e=>{e.preventDefault();doSave(true)};

function subStoreAmounts(c,st){const dm={};db.subStLines.filter(x=>x.statement===st.id).forEach(x=>dm[x.line]=x.done);const a=subCalc(c,st,dm,db.subDeductions.filter(d=>d.statement===st.id));

function subSetStatusLocal(c,st,to){markDirty('subStatements',st);
 if(to==='Checked'){subStoreAmounts(c,st);st.checkedBy=me().name;if(st.kind==='Retention release'){if(!(st.netAmount>0)){alert('There is no retention to release.');return false}st.status='Approved';st.approvedBy=me().name;return true}}
 if(to==='Draft')st.checkedBy='';
 if(to==='Approved')st.approvedBy=me().name;
 st.status=to;return true}
async function subSetStatus(st,to){const c=db.subContracts.find(x=>x.id===st.contract);

const SB_WX={};
const POUR_RE=/b[ée]ton|coul[ée]|dalle|chape|concrete|pour|slab|toiture|roof|[ée]tanch/i;
function siteCoords(p){const m=String(p&&p.siteMap||'').match(/(-?\d{1,2}\.\d{3,})\s*,\s*(-?\d{1,3}\.\d{3,})/);return m?[+m[1],+m[2]]:null}

function siteBoard(p){

 const todayLog=L.find(l=>l.date===t),last=L[0];

 const tiles=[];
 // weather
 tiles.push(`<div class="sbt" id="sbWx" data-pid="${p.id}" data-pour="${POUR_RE.test(pourTxt)?1:''}" data-pour2="${POUR_RE.test(pour2)?1:''}"><div class="sbl">${svgi('sun')} Weather</div>${siteCoords(p)?'<div class="sbv">…</div><div class="s">Loading the forecast</div>':`<div class="sbv">–</div><div class="s">Add the site on the map (Edit details) to see the weather here.</div>`}</div>`);
 // people on site
 const wl=todayLog||last,crew=wl?String(wl.crew||'').split('\n').map(s=>s.trim()).filter(Boolean).slice(0,3).join(' · '):'';
 tiles.push(`<div class="sbt${can('site')?' go" data-sbgo="site':''}"><div class="sbl">${svgi('helmet')} On site ${todayLog?'today':''}</div><div class="sbv">${wl?(+wl.workers||0):'–'}</div><div class="s">${todayLog?(esc(crew)||'From today\'s report'):wl?'No report today yet. Last one: '+fmtD(wl.date):'No daily report yet'}</div></div>`);
 // deliveries expected
 if(can('procurement')&&!R().noProcurement){
  const D=db.procurement.filter(x=>x.project===p.id&&['Approved','Ordered','Partly delivered'].includes(x.status)&&x.needBy&&x.needBy<=addDays(t,2)).sort((a,b)=>a.needBy.localeCompare(b.needBy));
  const ready=(db.prmOrders||[]).filter(o=>o.project===p.id&&o.status==='Prepared');
  const lines=[...D.slice(0,2).map(x=>`${esc(x.item)} · ${sbWhen(x.needBy)}`),...ready.slice(0,1).map(o=>`PROMAT ${esc(o.number||'')} ready to collect`)];
  tiles.push(`<div class="sbt go${D.some(x=>x.needBy<t)?' bad':''}" data-sbgo="procurement"><div class="sbl">${svgi('truck')} Deliveries due</div><div class="sbv">${D.length+ready.length}</div><div class="s">${lines.join('<br>')||'Nothing due in the next 2 days'}</div></div>`)}

 // days without accident

 // progress drawn as a building

 return `${sbActions(p,todayLog)}<div id="sbRain"></div><div class="sbgrid">${tiles.join('')}</div><div class="sbgrid2">${safe}${prog}</div>`;
}

  try{const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${xy[0]}&longitude=${xy[1]}&current=temperature_2m,weather_code&hourly=precipitation_probability&forecast_days=2&timezone=auto`);if(!r.ok)throw 0;w=SB_WX[key]={at:Date.now(),d:await r.json()}}

 const d=w.d,cur=d.current||{},[txt,ic]=wxText(+cur.weather_code||0),H=d.hourly||{time:[],precipitation_probability:[]};
 const nowH=String(cur.time||'').slice(0,13),late=+String(cur.time||'').slice(11,13)>=17;

 const wet=[];H.time.forEach((tm,i)=>{const h=+tm.slice(11,13);if(tm.slice(0,10)===day&&h>=6&&h<=18&&(late||tm.slice(0,13)>=nowH)&&H.precipitation_probability[i]>=60)wet.push([h,H.precipitation_probability[i]])});
 const max=Math.max(0,...H.time.map((tm,i)=>tm.slice(0,10)===day&&+tm.slice(11,13)>=6&&+tm.slice(11,13)<=18?H.precipitation_probability[i]:0));
 const hh=h=>String(h).padStart(2,'0')+':00';

function gantt(T){

 const s=T.reduce((a,t)=>t.start<a?t.start:a,T[0].start),e=T.reduce((a,t)=>t.end>a?t.end:a,T[0].end);

 const tp=Math.min(100,Math.max(0,pos(today())));
 return `<div class="card gantt"><h2>Timeline <span class="s" style="font-weight:400">${fmtD(s)} – ${fmtD(e)}</span></h2>
 ${[...T].sort((a,b)=>a.start.localeCompare(b.start)).map(t=>`<div class="grow"><div class="gname" title="${esc(t.name)}">${esc(t.name)}</div><div class="gtrack"><div class="gbar ${t.status==='Done'?'done':taskLate(t)?'late':''}" style="left:${pos(t.start)}%;width:${Math.max(1.5,pos(t.end)-pos(t.start))}%"></div><div style="position:absolute;left:${tp}%;top:-3px;bottom:-3px;width:2px;background:var(--brand)"></div></div></div>`).join('')}</div>`;

// Shrink to a phone-friendly JPEG before upload (a 5 MB camera photo becomes ~300 KB)
async function shrink(file,max,q){
 const url=URL.createObjectURL(file);
 try{const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>no(new Error('not an image'));i.src=url});
  const s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)),c=document.createElement('canvas');
  c.width=Math.round(img.naturalWidth*s);c.height=Math.round(img.naturalHeight*s);
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
  return await new Promise((ok,no)=>c.toBlob(b=>b?ok(b):no(new Error('could not process')),'image/jpeg',q));
 }finally{URL.revokeObjectURL(url)}
}
const blobToData=b=>new Promise(ok=>{const r=new FileReader();r.onload=()=>ok(r.result);r.readAsDataURL(b)});

function roWrap(){

 const r0=sb.rpc.bind(sb);sb.rpc=(f,a,o)=>viewAs?ro():r0(f,a,o);

async function shrinkImg(file,size){
 const url=URL.createObjectURL(file);
 try{const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>no(new Error('this picture could not be opened. Try a JPG or PNG photo.'));i.src=url});
  const w=img.naturalWidth,h=img.naturalHeight,s=Math.min(w,h),c=document.createElement('canvas');c.width=c.height=size;
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,size,size);x.drawImage(img,(w-s)/2,(h-s)/2,s,s,0,0,size,size);return c}
 finally{URL.revokeObjectURL(url)}}
async function setMyPhoto(file){

  if(file){profBusy='Preparing photo…';render();const c=await shrinkImg(file,CLOUD?400:160);
   if(!CLOUD)next=c.toDataURL('image/jpeg',0.8);
   else{const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',0.85));if(!blob)throw new Error('the photo could not be prepared.');
    next=session+'/'+Date.now().toString(36)+'.jpg';profBusy='Uploading…';render();
    const{error}=await sb.storage.from('avatars').upload(next,blob,{contentType:'image/jpeg',cacheControl:'31536000',upsert:false});

  u.avatar=next;

function boqLots(pid){const B=boqRows(pid);
 if(!B.length){const P=(db.boqProg||{})[pid];return P?P.map(x=>({lot:x.lot||'',pct:+x.done_pct||0,lines:x.lines})):[]}
 const m=new Map();B.forEach(b=>{const k=b.lot||'',w=+b.unitPrice>0?+b.unitPrice:1,o=m.get(k)||{lot:k,tot:0,done:0,value:0,lines:0};
  o.tot+=(+b.qty||0)*w;o.done+=Math.min(+b.qtyDone||0,+b.qty||0)*w;o.value+=(+b.qty||0)*(+b.unitPrice||0);o.lines++;m.set(k,o)});

function boqPct(pid){const L=boqLots(pid);if(!L.length)return null;

async function stockMove(it,kind,qty,note,date){
 if(CLOUD){const{data,error}=await sb.from('stock_moves').insert({id:uid(),item:it.id,location:stLoc(it),kind,qty,note:note||'',date:date||today()}).select();
  if(error){alert('Could not save: '+error.message);return false}const m=fromRow(data[0]);db.stockMoves.push(m);it.qty=+m.qtyAfter;render();return true}
 const s=kind==='in'?Math.abs(qty):kind==='used'?-Math.abs(qty):+qty;
 if((+it.qty||0)+s<0){alert(`Not enough ${it.name} in stock (${fmtQ(it.qty)} ${it.unit||''} left).`);return false}
 if(kind==='adjust'&&!note){alert('Write why the count is different.');return false}

 const b64=blob=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]);r.onerror=no;r.readAsDataURL(blob)});
 const safe=n=>String(n||'file').replace(/[\\/:*?"<>|]+/g,'-').slice(0,120);
 async function toUri(blob,name){const w=await P.Filesystem.writeFile({path:safe(name),data:await b64(blob),directory:'CACHE'});return w.uri}
 async function shareFiles(files,title,text){const uris=[];for(const f of files)uris.push(await toUri(f,f.name));await P.Share.share({files:uris,title:title||'',text:text||'',dialogTitle:title||'Share'})}
 // downloads: save the file and open the phone's Share menu (save to Files, WhatsApp, email...)
 window.dlBlob=async function(b,name){try{await shareFiles([new File([b],name||'document',{type:b.type})],name)}catch(e){if(!/cancel/i.test(String(e&&e.message||e)))alert('Could not share the file: '+(e.message||e))}};
 // Web Share in the app goes through the phone's Share menu
 navigator.canShare=()=>true;

 async function openOut(u){u=String(u||'');if(!u)return;
  if(u.startsWith('blob:')||u.startsWith('data:')){try{const b=await (await fetch(u)).blob();await shareFiles([new File([b],'document'+(b.type==='application/pdf'?'.pdf':b.type.startsWith('image/')?'.'+b.type.split('/')[1]:''),{type:b.type})],'Document')}catch(e){}return}
  location.href=u}

 window.open=function(u,t){if(u&&!/^(blob:|data:)/.test(u)&&new URL(u,location.href).host===location.host)return realOpen(u,t);
  if(u){openOut(u);return{closed:false,close(){},focus(){}}}
  // an empty window that the app fills later: send what it gets to the right place
  let html='';const go=x=>openOut(x);const loc={set href(x){go(x)},assign:go,replace:go};
  const w={closed:false,focus(){},close(){this.closed=true},document:{open(){},write(x){html+=x},writeln(x){html+=x},close(){},title:''},print(){alert('To print, tap PDF, then print it from the PDF.')}};
  Object.defineProperty(w,'location',{get:()=>loc,set:go});return w};

  let u;try{u=new URL(h,location.href)}catch(x){return}if(u.host===location.host&&!/^(tel|mailto|sms|whatsapp|geo):/.test(u.protocol))return;e.preventDefault();openOut(u.href)},true);
 // Android back button: close what is open, then go back, then leave the app
 if(P.App)P.App.addListener('backButton',()=>{const d=[...document.querySelectorAll('dialog[open]')].pop();if(d){d.close();return}

function openForm(coll,id,prefill,onSaved){

 if(coll==='logs'&&R().noIssues)fields=fields.filter(f=>f[0]!=='issues');
 const keys=fields.map(f=>f[0]);
 let editable=rule==='all'?[...keys]:Array.isArray(rule)?rule:[];
 if(coll==='procurement'&&!R().flow)editable=editable.filter(k=>k!=='status');
 if(coll==='projects'&&rec.code&&me().role!=='director')editable=editable.filter(k=>k!=='code');

 const defs={discipline:'Other',project:projF!=='all'?projF:myProjects()[0]?.id,date:today(),start:today(),end:addDays(today(),7),needBy:addDays(today(),7),progress:0,author:me().name,name:coll==='requests'?me().name:undefined,email:coll==='requests'?me().email:undefined,projects:[]};
 const field=([k,l,type,req])=>{
  let v=k in over?over[k]:rec[k]??defs[k]??'';const dis=editable.includes(k)?'':'disabled';
  if(type==='map')return `<div class="f"><label>${l}</label><div class="row2"><input name="${k}" value="${esc(v)}" maxlength="500" placeholder="Paste a Google Maps link" ${dis}>${dis?'':`<button type="button" class="btn ghost sm" data-geo="${k}">${svgi('map')} Use my location</button>`}</div><small class="s">On site? Tap "Use my location".</small></div>`;
